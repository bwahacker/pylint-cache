[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylint-cache"
version = "1.1.0"
description = "A smart caching wrapper for pylint with dependency-aware cache invalidation"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Mitch Haile", email = "mitch@featrix.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pylint>=2.0.0",
]

[project.scripts]
pylint-cache = "pylint_cache:main"
pylint-cache-monitor = "pylint_cache_monitor:main"

[project.urls]
Homepage = "https://www.featrix.ai"
Repository = "https://github.com/bwahacker/pylint-cache"
Issues = "https://github.com/bwahacker/pylint-cache/issues"

